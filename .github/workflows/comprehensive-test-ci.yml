name: Comprehensive Test & Coverage CI (>= 95%)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comprehensive-test-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Kiểm thử Logic Nghiệp vụ & Hợp đồng API liên Module (Frontend)
  frontend-logic-and-contracts:
    name: Frontend Logic & Cross-Module API Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Business Logic & State Tests (Manager, Member, Package Benefits, Images)
        run: |
          npm run test:manager
          npm run test:benefits
          npm run test:member
          npm run test:images

      - name: Run Cross-Module API Contract & Interceptor Tests (All 5 Role Services)
        run: npm run test:contracts

  # 2. Kiểm thử UI/UX, Đa ngôn ngữ (EN/VI), Phân quyền & Cổng Coverage >= 95% (Frontend)
  frontend-ui-ux-and-coverage-gate:
    name: Frontend UI/UX Consistency & Coverage Gate (>= 95%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static UI/Code Lint (Oxlint)
        run: npm run lint

      - name: Run Bilingual i18n & Cross-Module UI/UX SSR Consistency Tests
        run: |
          npm run test:i18n
          npm run test:consistency

      - name: Enforce Full Frontend Test Coverage Gate (>= 95% Lines)
        run: npm run test:coverage

  # 3. Kiểm thử Unit, Bảo mật JWT, Liên thông Service & Cổng JaCoCo Coverage >= 95% (Backend)
  backend-unit-and-coverage-gate:
    name: Backend Unit, Security & JaCoCo Coverage Gate (>= 95%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: Backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Unit & Cross-Module Service Tests with JaCoCo >= 95% Gate
        run: ./mvnw --batch-mode --no-transfer-progress test "-Dtest=AvatarStorageServiceTests,ResourceImageStorageServiceTests,TeachingSlotsTests,CoachProfileServiceTests,CourseSchedulePlannerTests,SchedulePlannerTests,SystemComprehensiveUnitTests"

      - name: Upload Backend JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-coverage-report
          path: Backend/target/site/jacoco
          if-no-files-found: error
          retention-days: 7

  # 4. Kiểm thử Tích hợp Toàn hệ thống với MySQL 8.4 (Backend Integration)
  backend-mysql-integration-tests:
    name: Backend Full System Integration Tests (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: SportCenter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: Backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Initialize MySQL schema and role fixtures
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS SportCenter; CREATE DATABASE SportCenter CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          tail -n +4 database_init.sql | mysql --protocol=TCP -h 127.0.0.1 -uroot -proot SportCenter
          mysql --protocol=TCP -h 127.0.0.1 -uroot -proot SportCenter -e "INSERT IGNORE INTO ROLES (role_id, role_name) VALUES (1, 'Center Manager'), (2, 'Receptionist'), (3, 'Coach'), (4, 'Member');"

      - name: Run Full Backend Integration & Migration Suite
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/SportCenter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          MIGRATION_TEST_URL: jdbc:mysql://127.0.0.1:3306/SportCenter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          MIGRATION_TEST_USERNAME: root
          MIGRATION_TEST_PASSWORD: root

  # 5. Tổng hợp Cổng Chất lượng (Quality Gate Summary)
  coverage-quality-gate:
    name: Comprehensive Test & Coverage Gate Summary
    runs-on: ubuntu-latest
    needs:
      - frontend-logic-and-contracts
      - frontend-ui-ux-and-coverage-gate
      - backend-unit-and-coverage-gate
      - backend-mysql-integration-tests
    if: always()
    steps:
      - name: Evaluate All Test & Coverage Gates
        run: |
          echo "## 🧪 Comprehensive Test & Coverage Report (>= 95% Gate)" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Logic & API Contracts | **${{ needs.frontend-logic-and-contracts.result }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend UI/UX & Coverage Gate (>= 95%) | **${{ needs.frontend-ui-ux-and-coverage-gate.result }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Unit, Security & JaCoCo Gate (>= 95%) | **${{ needs.backend-unit-and-coverage-gate.result }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend MySQL 8.4 Integration Suite | **${{ needs.backend-mysql-integration-tests.result }}** |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.frontend-logic-and-contracts.result }}" != "success" ] || \
             [ "${{ needs.frontend-ui-ux-and-coverage-gate.result }}" != "success" ] || \
             [ "${{ needs.backend-unit-and-coverage-gate.result }}" != "success" ] || \
             [ "${{ needs.backend-mysql-integration-tests.result }}" != "success" ]; then
            echo "::error::Comprehensive Test or Coverage Gate (< 95%) failed!"
            exit 1
          fi
          echo "All Frontend & Backend tests and >= 95% coverage gates passed!"
