name: CI/CD Quality Pipeline (DGDoC)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Quét Dockerfile với Hadolint (DGDoC Hadolint)
  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Hadolint on Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "outputs/Backend/Dockerfile"
          ignore: "DL3008,DL3015,DL3018,DL3019,DL3059"
          failure-threshold: "error"

      - name: Run Hadolint on Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "outputs/Frontend/Dockerfile"
          ignore: "DL3008,DL3015,DL3018,DL3019,DL3059"
          failure-threshold: "error"

  # 2. Quét & Kiểm thử chất lượng Frontend thật sự (Lint, Unit Tests, Build)
  frontend-quality:
    name: Frontend Quality (Lint, Unit Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static Code Analysis (Oxlint)
        run: npm run lint

      - name: Run Frontend Unit & Rendering Tests (55 Tests)
        run: npm test

      - name: Production Bundle Verification (Vite Build)
        run: npm run build

  # 3. Quét & Kiểm thử chất lượng Backend thật sự (Compile, JUnit Tests, Checkstyle)
  backend-quality:
    name: Backend Quality (Compile, Tests & Checkstyle)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: SportCenter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: Backend/pom.xml

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Initialize Database Schema & Seed Data
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS SportCenter; CREATE DATABASE SportCenter CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          tail -n +4 database_init.sql | mysql --protocol=TCP -h 127.0.0.1 -uroot -proot SportCenter
          mysql --protocol=TCP -h 127.0.0.1 -uroot -proot SportCenter -e "INSERT IGNORE INTO ROLES (role_id, role_name) VALUES (1, 'Center Manager'), (2, 'Receptionist'), (3, 'Coach'), (4, 'Member');"

      - name: Execute Maven Unit & Integration Tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/SportCenter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          MIGRATION_TEST_URL: jdbc:mysql://127.0.0.1:3306/SportCenter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          MIGRATION_TEST_USERNAME: root
          MIGRATION_TEST_PASSWORD: root

      - name: Run Java Checkstyle Analysis
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-checkstyle-plugin:3.3.1:checkstyle \
            -Dcheckstyle.config.location=google_checks.xml \
            -Dcheckstyle.failsOnError=false \
            -Dcheckstyle.consoleOutput=false

      - name: Upload Java Checkstyle Quality Report
        uses: actions/upload-artifact@v4
        with:
          name: dgdoc-java-checkstyle-report
          path: Backend/target/checkstyle-result.xml
          if-no-files-found: ignore
          retention-days: 7

  # 4. Quét bảo mật mã nguồn (Security SAST Scanner)
  security-sast-scan:
    name: Security & Vulnerability Scan (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (Avoid Rate Limiting)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # 5. Quality Gate Summary (Chặn merge nếu bất kỳ bài kiểm tra nào thất bại)
  quality-gate-summary:
    name: Quality Gate Summary (Enforce All Pass)
    runs-on: ubuntu-latest
    needs: [dockerfile-lint, frontend-quality, backend-quality, security-sast-scan]
    if: always()
    steps:
      - name: Check overall quality gate results
        run: |
          if [ "${{ needs.dockerfile-lint.result }}" != "success" ] || \
             [ "${{ needs.frontend-quality.result }}" != "success" ] || \
             [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.security-sast-scan.result }}" != "success" ]; then
            echo "::error::Quality Gate failed! Pull Request cannot be merged until all quality checks pass."
            echo "Dockerfile Lint: ${{ needs.dockerfile-lint.result }}"
            echo "Frontend Quality: ${{ needs.frontend-quality.result }}"
            echo "Backend Quality: ${{ needs.backend-quality.result }}"
            echo "Security SAST: ${{ needs.security-sast-scan.result }}"
            exit 1
          fi
          echo "All code quality and security checks passed! Ready to merge."
