# SonarQube Cloud Configuration for SWP391 Team 4
# Exclude database dumps, data seed scripts, and build artifacts from duplication check
sonar.exclusions=**/*.sql,**/generate_seed_sql.js,**/node_modules/**,**/dist/**,**/target/**
sonar.cpd.exclusions=**/*.sql,**/generate_seed_sql.js,**/*Test*.java,**/*.test.js,**/*.test.jsx

# Main source code directories for real quality scoring
sonar.sources=Frontend/src,Backend/src/main/java
sonar.tests=Frontend/src,Backend/src/test/java
sonar.test.inclusions=**/*Test*.java,**/*.test.js,**/*.test.jsx

# Encoding
sonar.sourceEncoding=UTF-8
