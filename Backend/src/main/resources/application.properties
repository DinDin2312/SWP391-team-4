spring.application.name=sportscenter
server.port=8080

# Database Configuration (Example for MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/SportCenter?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email SMTP Configuration (Sử dụng biến môi trường IntelliJ)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
