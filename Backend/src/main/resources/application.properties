spring.application.name=sportscenter
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/SportCenter?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Ho_Chi_Minh}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Account avatar uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.avatar-storage-dir=${AVATAR_UPLOAD_DIR:uploads/avatars}
app.resource-image-storage-dir=${RESOURCE_IMAGE_UPLOAD_DIR:uploads/resource-images}

# Email SMTP Configuration (S? d?ng bi?n m�i tr�?ng IntelliJ)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# VNPay Configuration
vnpay.tmnCode=${VNPAY_TMN_CODE:6USNZBRC}
vnpay.hashSecret=${VNPAY_HASH_SECRET:NHDNKQAALSCXIFEKLSFWLHFUGPGCCFVY}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:5173/member/payment-result}

# MoMo Configuration
