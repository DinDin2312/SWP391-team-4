# ==============================================================================
# CẤU HÌNH TÀI KHOẢN NGÂN HÀNG NHẬN TIỀN THẬT (VIETQR NAPAS 247)
# Bạn chỉ cần điền đúng 3 dòng này, tiền thanh toán sẽ vào thẳng tài khoản của bạn:
# 1. vietqr.bank-id: Tên hoặc mã ngân hàng (MB, VCB, TCB, ICB, BIDV, ACB, VPB, TPB,...)
# 2. vietqr.account-no: Số tài khoản ngân hàng của bạn
# 3. vietqr.account-name: Tên người nhận (Họ và tên chủ tài khoản)
# ==============================================================================
vietqr.bank-id=${BANK_ID:MB}
vietqr.account-no=${BANK_ACCOUNT_NO:0386789999}
vietqr.account-name=${BANK_ACCOUNT_NAME:NGUYEN VAN A}

# PayOS Configuration (Tùy chọn: chỉ cần khi bạn muốn tích hợp cổng PayOS chính thức)
payos.clientId=${PAYOS_CLIENT_ID:}
payos.apiKey=${PAYOS_API_KEY:}
payos.checksumKey=${PAYOS_CHECKSUM_KEY:}
payos.endpoint=${PAYOS_ENDPOINT:https://api-merchant.payos.vn}
payos.returnUrl=${PAYOS_RETURN_URL:http://localhost:5173/member/payment-result}
payos.cancelUrl=${PAYOS_CANCEL_URL:http://localhost:5173/member/cart}

# Gemini AI Key
gemini.api.key=${GEMINI_API_KEY:}






# Flyway owns schema changes; Hibernate validates mappings after migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
