# Extra settings for a public server (VPS). Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
# Caddy serves the app on ports 80/443 and gets a free HTTPS certificate for DOMAIN by itself.
services:
  mysql:
    ports: !reset []          # MySQL is not reachable from the internet

  frontend:
    ports: !reset []          # only Caddy is public

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. 203.0.113.10.sslip.io or your own domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
