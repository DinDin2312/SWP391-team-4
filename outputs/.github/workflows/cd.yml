name: CD Pipeline (Docker Build & Smoke Test)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-smoke-test:
    name: Docker Build & Full-Stack Smoke Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services via Docker Compose
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for Backend & Frontend readiness and run Smoke Checks
        run: |
          echo "Waiting for Backend API on port 8080..."
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/guest/packages > /dev/null 2>&1; then
              echo "Backend is up and serving /api/guest/packages!"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "::error::Backend failed to become ready in time"
              docker compose logs
              exit 1
            fi
            sleep 3
          done

          echo "Verifying Public Schedules API..."
          curl -fsS http://127.0.0.1:8080/api/guest/schedules > /dev/null

          echo "Verifying Frontend Nginx server on port 5173..."
          curl -fsS http://127.0.0.1:5173/ > /dev/null
          echo "Smoke verification succeeded!"

      - name: Tear down Docker Compose environment
        if: always()
        run: docker compose down -v
