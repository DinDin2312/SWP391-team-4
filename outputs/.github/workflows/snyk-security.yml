name: DevSecOps Security Scan (Snyk & Trivy SCA/SAST)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: GitHub Dependency Review (PR Gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review Action
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  pom-vulnerability-check:
    name: Backend Maven Security Policy Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit pom.xml for known Demo Snyk CVEs (RCE & XXE)
        run: |
          echo "Checking Backend/pom.xml for vulnerable demo dependencies..."
          FOUND_VULN=0
          if grep -q "<artifactId>commons-collections</artifactId>" pom.xml && grep -q "<version>3.2.2</version>" pom.xml; then
            echo "::warning file=Backend/pom.xml::Detected DEMO Snyk 1: commons-collections:3.2.2 (Critical RCE Vulnerability). Remove or replace before merging to main."
            FOUND_VULN=1
          fi
          if grep -q "<artifactId>dom4j</artifactId>" pom.xml && grep -q "<version>2.1.3</version>" pom.xml; then
            echo "::warning file=Backend/pom.xml::Detected DEMO Snyk 2: org.dom4j:dom4j:2.1.3 (High XXE Vulnerability CVE-2020-10683). Upgrade to 2.1.4+ or remove before merging to main."
            FOUND_VULN=1
          fi
          if [ "$FOUND_VULN" -eq 1 ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "::error::Blocking merge/push on main branch due to unresolved DEMO Snyk vulnerabilities in Backend/pom.xml"
            exit 1
          fi
          echo "Maven policy check completed."

  snyk-scan:
    name: Snyk Open Source & Code Scan (SCA + SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: Backend/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Run Snyk CLI Security Scan (when SNYK_TOKEN is configured)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::notice::SNYK_TOKEN secret is not configured. Skipping remote Snyk API scan."
            exit 0
          fi
          npm install -g snyk
          echo "--- Running Snyk SCA on Backend (Maven) ---"
          cd Backend && chmod +x mvnw && snyk test --severity-threshold=high --file=pom.xml
          echo "--- Running Snyk SCA on Frontend (npm) ---"
          cd ../Frontend && npm ci && snyk test --severity-threshold=high

  trivy-fs-scan:
    name: Trivy Vulnerability & Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability and secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
